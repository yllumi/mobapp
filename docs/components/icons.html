<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/mobapp/assets/style.css" rel="stylesheet">
</head>

<body>

    <div id="components">

        <div class="app-header">
            <div class="left">
                <a href="javascript:void()" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i>
                </a>
            </div>
            <div class="page-title">Icons</div>
            <div class="right">
            </div>
        </div>

        <div class="app-container">
            <!-- App Capsule -->
            <div id="appCapsule" class="container mt-3">

                <!-- Informasi Pustaka Ikon -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Bootstrap Icons</h5>
                        <p class="card-text text-muted small">
                            High quality, open source icon library with over <strong>1,300+ icons</strong> crafted for web
                            and mobile apps.
                        </p>
                        <a href="https://icons.getbootstrap.com/" target="_blank"
                            class="btn btn-sm btn-outline-primary">Jelajahi Bootstrap Icons</a>
                    </div>
                </div>

                <!-- Section: Iconed Boxes (Warna Teks / Border) -->
                <div class="mb-4">
                    <div class="fw-bold mb-2">Iconed Boxes</div>
                    <div class="border rounded p-3 bg-white d-flex flex-wrap gap-2">
                        <!-- d-inline-flex, rounded, border, dan ukuran diatur murni lewat utilitas Bootstrap -->
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-primary"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-secondary"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-success"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-danger"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-warning"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-info"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center border rounded text-dark"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span
                            class="d-inline-flex align-items-center justify-content-center border rounded text-muted bg-light"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                    </div>
                </div>

                <!-- Section: Backgrounded (Kotak dengan Background Berwarna) -->
                <div class="mb-4">
                    <div class="fw-bold mb-2">Backgrounded</div>
                    <div class="border rounded p-3 bg-white d-flex flex-wrap gap-2">
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span
                            class="d-inline-flex align-items-center justify-content-center rounded bg-secondary text-white"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-success text-white"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-danger text-white"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-warning text-dark"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-info text-dark"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span class="d-inline-flex align-items-center justify-content-center rounded bg-dark text-white"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                        <span
                            class="d-inline-flex align-items-center justify-content-center rounded bg-light text-dark border"
                            style="width: 42px; height: 42px;">
                            <i class="bi bi-plus-lg fs-5"></i>
                        </span>
                    </div>
                </div>

                <!-- Section: Size (Variasi Ukuran Kotak dan Ikon) -->
                <div class="mb-4">
                    <div class="fw-bold mb-2">Size</div>
                    <div class="border rounded p-3 bg-white">

                        <!-- Small (sm) -->
                        <div class="mb-3">
                            <div class="text-muted small mb-1"><code>Size SM (32px)</code></div>
                            <span
                                class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                                style="width: 32px; height: 32px;">
                                <i class="bi bi-emoji-smile fs-6"></i>
                            </span>
                        </div>

                        <!-- Normal/Default -->
                        <div class="mb-3">
                            <div class="text-muted small mb-1"><code>Size Default (42px)</code></div>
                            <span
                                class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                                style="width: 42px; height: 42px;">
                                <i class="bi bi-emoji-smile fs-5"></i>
                            </span>
                        </div>

                        <!-- Large (lg) -->
                        <div class="mb-3">
                            <div class="text-muted small mb-1"><code>Size LG (48px)</code></div>
                            <span
                                class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                                style="width: 48px; height: 48px;">
                                <i class="bi bi-emoji-smile fs-4"></i>
                            </span>
                        </div>

                        <!-- Extra Large (xl) -->
                        <div class="mb-3">
                            <div class="text-muted small mb-1"><code>Size XL (56px)</code></div>
                            <span
                                class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                                style="width: 56px; height: 56px;">
                                <i class="bi bi-emoji-smile fs-3"></i>
                            </span>
                        </div>

                        <!-- Double Extra Large (xxl) -->
                        <div>
                            <div class="text-muted small mb-1"><code>Size XXL (64px)</code></div>
                            <span
                                class="d-inline-flex align-items-center justify-content-center rounded bg-primary text-white"
                                style="width: 64px; height: 64px;">
                                <i class="bi bi-emoji-smile fs-2"></i>
                            </span>
                        </div>

                    </div>
                </div>

            </div>
            <!-- * App Capsule -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/mobapp/assets/main.js"></script>
</body>

</html>
