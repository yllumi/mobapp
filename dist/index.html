<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <body>
<style>
    .app-header {
            padding: 1rem;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .app-header .icon {
            font-size: 1.5rem;
            color: #333;
        }
        .page-content {
            padding: 1rem;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 1rem;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .dark-mode-text {
            font-size: 1rem;
            font-weight: bold;
        }
        .discover-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 1rem;
        }
</style>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span class="sidebar-logo"><i class="bi bi-grid-1x2-fill me-2 text-primary"></i>MobApp</span>
        <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    </div>
    <nav class="sidebar-nav">
        <a href="#" class="active"><i class="bi bi-house-door"></i> Home</a>
        <a href="#"><i class="bi bi-heart"></i> Favorites</a>
        <a href="#"><i class="bi bi-file-earmark"></i> Pages</a>
        <div class="nav-divider"></div>
        <a href="/components"><i class="bi bi-grid"></i> Components</a>
        <a href="#"><i class="bi bi-palette"></i> Themes</a>
        <div class="nav-divider"></div>
        <a href="#"><i class="bi bi-gear"></i> Settings</a>
        <a href="#"><i class="bi bi-question-circle"></i> Help</a>
    </nav>
    <div class="sidebar-footer">
        &copy; 2026 MobApp
    </div>
</div>

<div id="homepage">

    <!-- Header -->
    <div class="app-header">
        <i class="bi bi-list icon" id="sidebarToggle" style="cursor:pointer"></i>
        <i class="bi bi-search icon"></i>
    </div>

    <!-- Page Content -->
    <div class="app-container px-3">
        <h1 class="section-title">Discover</h1>
        <p>Welcome to Mobilekit</p>

        <!-- Feature Cards -->
        <div class="row g-2">
            <div class="col-6">
                <div class="card p-2 text-center">
                    <img src="https://mobilekit.bragherstudio.com/view29/assets/img/sample/photo/wide3.jpg" class="img-fluid mx-auto d-block">
                    <p class="mb-0 fw-bold">Progressive web app ready</p>
                </div>
            </div>
            <div class="col-6">
                <div class="card p-2 text-center">
                    <img src="https://mobilekit.bragherstudio.com/view29/assets/img/sample/photo/wide4.jpg" class="img-fluid mx-auto d-block">
                    <p class="mb-0 fw-bold">Reusable components</p>
                </div>
            </div>
        </div>

        <!-- Dark Mode Toggle -->
        <div class="toggle-container mt-3">
            <div>
                <small class="text-muted">DISCOVER</small>
                <p class="dark-mode-text mb-0">Dark Mode</p>
            </div>
            <div>
                <input type="checkbox" class="form-check-input" id="darkModeToggle">
            </div>
        </div>

    </div>

    <div class="app-bottommenu no-border">
    <a href="/" id="bottommenu-item" class="item active">
        <div class="col">
            <div class="bullet">
                <i class="bi bi-house"></i> 
            </div>
            Home
        </div>
    </a>
    <a href="/components" id="bottommenu-item" class="item">
        <div class="col">
            <div class="bullet">
                <i class="bi bi-heart"></i> 
            </div>
            Components
        </div>
    </a>
    <a href="/pages" id="bottommenu-item" class="item">
        <div class="col">
            <div class="bullet">
                <i class="bi bi-file-earmark"></i> 
            </div>
            Pages
        </div>
    </a>
    <a href="#" id="bottommenu-item" class="item">
        <div class="col">
            <div class="bullet">
                <i class="bi bi-menu-app"></i> 
            </div>
            Menu
        </div>
    </a>
</div></div>

<script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('sidebarToggle');
    const closeBtn = document.getElementById('sidebarClose');

    function openSidebar() {
        sidebar.classList.add('show');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
        sidebar.classList.remove('show');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    toggleBtn.addEventListener('click', openSidebar);
    closeBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/assets/main.js"></script>
  </body>
</html>
